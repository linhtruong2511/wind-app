{% load static %}
{% load client_lib_tags %}
{% load client_version %}

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% block font %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'fonts/montserrat.css' %}" rel="stylesheet">
{% endblock font %}

<link href="{% static 'mapstore/dist/themes/geonode.css' %}?{% client_version %}" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'wind_management/css/wind_portal.css' %}">
<title>{{ SITE_NAME }}</title>

{% block favicon %}
    <link rel="shortcut icon" href="{% static 'wind_management/images/wind_logo.svg' %}" />
{% endblock favicon %}

{% block extras %}
{% endblock extras %}
